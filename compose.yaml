name: python-recall

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-python_recall}
      POSTGRES_USER: ${POSTGRES_USER:-python_recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-python_recall}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: development
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_NEW_CARDS_PER_DAY: ${APP_NEW_CARDS_PER_DAY:-20}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-python_recall}:${POSTGRES_PASSWORD:-python_recall}@postgres:5432/${POSTGRES_DB:-python_recall}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-5m}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-1048576}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/database')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.250.0/24}
