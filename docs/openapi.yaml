          description: Saved generation result replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardSuggestionBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/AiInvalidResponse" }
        "503": { $ref: "#/components/responses/AiUnavailable" }
        "504": { $ref: "#/components/responses/AiTimeout" }

  /ai/card-suggestions:
    get:
      tags: [AI]
      operationId: list_card_suggestions
      summary: List generated card suggestions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
