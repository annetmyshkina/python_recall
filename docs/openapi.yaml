openapi: 3.1.0
info:
  title: Python Recall API
  version: 0.1.0
  description: REST API Release 1 for the local Python Recall learning system.
servers:
  - url: /api/v1
    description: Local API v1
tags:
  - name: Categories
  - name: Topics
  - name: Tags
  - name: Cards
  - name: Reviews
  - name: Statistics
  - name: Adaptive Learning
  - name: AI
  - name: Health

paths:
  /categories:
    get:
      tags: [Categories]
      operationId: list_categories
      summary: List categories
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Categories]
      operationId: create_category
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Category created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /categories/{category_id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      operationId: get_category
      summary: Get a category
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Categories]
      operationId: update_category
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Categories]
      operationId: delete_category
      summary: Delete an empty category
      responses:
        "204":
          description: Category deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /topics:
    get:
      tags: [Topics]
      operationId: list_topics
      summary: List topics
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated topics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Topics]
      operationId: create_topic
      summary: Create a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicCreate"
      responses:
        "201":
          description: Topic created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /topics/{topic_id}:
    parameters:
      - $ref: "#/components/parameters/TopicId"
    get:
      tags: [Topics]
      operationId: get_topic
      summary: Get a topic
      responses:
        "200":
          description: Topic found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Topics]
      operationId: update_topic
      summary: Update or move a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicPatch"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Topics]
      operationId: delete_topic
      summary: Delete an empty topic
      responses:
        "204":
          description: Topic deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /tags:
    get:
      tags: [Tags]
      operationId: list_tags
      summary: List tags
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Tags]
      operationId: create_tag
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: Tag created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/TagId"
    get:
      tags: [Tags]
      operationId: get_tag
      summary: Get a tag
      responses:
        "200":
          description: Tag found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Tags]
      operationId: update_tag
      summary: Rename a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatch"
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Tags]
      operationId: delete_tag
      summary: Delete a tag
      responses:
        "204":
          description: Tag deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /cards:
    get:
      tags: [Cards]
      operationId: list_cards
      summary: Search and list cards
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: topic_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: difficulty
          in: query
          schema:
            $ref: "#/components/schemas/Difficulty"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: is_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Cards]
      operationId: create_card
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCreate"
      responses:
        "201":
          description: Card created
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [Cards]
      operationId: get_card
      summary: Get a card
      responses:
        "200":
          description: Card found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Cards]
      operationId: update_card
      summary: Update, move, archive, or restore a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPatch"
      responses:
        "200":
          description: Card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Cards]
      operationId: delete_card
      summary: Delete a card without learning history
      responses:
        "204":
          description: Card deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/due:
    get:
      tags: [Reviews]
      operationId: list_due_cards
      summary: List cards currently available for review
      parameters:
        - name: topic_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: include_new
          in: query
          schema:
            type: boolean
            default: true
        - $ref: "#/components/parameters/ReviewLimit"
      responses:
        "200":
          description: Due and eligible new cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueCards"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/session:
    post:
      tags: [Reviews]
      operationId: build_review_session
      summary: Build a non-persistent review queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Generated queue snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/{card_id}/reference:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      tags: [Reviews]
      operationId: get_review_reference
      summary: Reveal the reference answer
      responses:
        "200":
          description: Reference answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewReference"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/{card_id}/attempts:
    parameters:
      - $ref: "#/components/parameters/CardId"
    post:
      tags: [Reviews]
      operationId: create_answer_attempt
      summary: Save a user answer without changing SM-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerAttemptCreate"
      responses:
        "201":
          description: Answer attempt saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerAttempt"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/{card_id}/complete:
    parameters:
      - $ref: "#/components/parameters/CardId"
    post:
      tags: [Reviews]
      operationId: complete_review
      summary: Apply a user-confirmed rating to SM-2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewComplete"
      responses:
        "201":
          description: Review completed for the first time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "200":
          description: Previously saved result replayed
          headers:
            Idempotency-Replayed:
              description: Always true for a replayed result.
              required: true
              schema:
                type: boolean
                const: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /reviews/history:
    get:
      tags: [Reviews]
      operationId: list_review_history
      summary: List immutable review history
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: card_id
          in: query
          schema:
            type: string
            format: uuid
        - name: topic_id
          in: query
          schema:
            type: string
            format: uuid
        - name: rating
          in: query
          schema:
            $ref: "#/components/schemas/Rating"
        - name: reviewed_from
          in: query
          schema:
            type: string
            format: date-time
        - name: reviewed_to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /statistics/overview:
    get:
      tags: [Statistics]
      operationId: get_statistics_overview
      summary: Get overall learning statistics
      responses:
        "200":
          description: Overall statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsOverview"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /statistics/topics:
    get:
      tags: [Statistics]
      operationId: list_topic_statistics
      summary: List statistics by topic
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated topic statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicStatisticsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /statistics/activity:
    get:
      tags: [Statistics]
      operationId: get_statistics_activity
      summary: Get daily review activity
      parameters:
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily activity in the configured learning timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityStatistics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /adaptive/topics:
    get:
      tags: [Adaptive Learning]
      operationId: list_topic_learning_signals
      summary: List explainable learning signals for topics
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LearningStatus"
        - name: period_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
      responses:
        "200":
          description: Paginated explainable learning signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicLearningSignalsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /ai/providers:
    get:
      tags: [AI]
      operationId: list_ai_providers
      summary: Inspect configured AI providers without affecting core health
      responses:
        "200":
          description: Configured providers and their current readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviders"
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/usage:
    get:
      tags: [AI]
      operationId: get_ai_usage
      summary: Get aggregate local AI usage without prompt contents or cost
      responses:
        "200":
          description: Aggregate usage by AI scenario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUsageSummary" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /ai/evaluate-answer:
    post:
      tags: [AI]
      operationId: evaluate_answer
      summary: Evaluate one saved learner answer without changing SM-2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerEvaluationCreate"
      responses:
        "201":
          description: Answer evaluation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerEvaluation"
        "200":
          description: Previously saved evaluation replayed
          headers:
