        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /ai/card-suggestions/{suggestion_id}/accept:
    parameters:
      - name: suggestion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [AI]
      operationId: accept_card_suggestion
      summary: Accept one suggestion and create its card transactionally
      responses:
        "200":
          description: Suggestion accepted and card created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardSuggestion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /ai/card-suggestions/{suggestion_id}/reject:
    parameters:
      - name: suggestion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [AI]
      operationId: reject_card_suggestion
      summary: Reject one pending card suggestion
      responses:
        "200":
          description: Suggestion rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardSuggestion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /health:
    get:
      tags: [Health]
      operationId: get_health
      summary: Check Backend liveness without dependencies
      responses:
        "200":
          description: Backend process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /health/database:
    get:
      tags: [Health]
      operationId: get_database_health
      summary: Check PostgreSQL availability
      responses:
        "200":
          description: PostgreSQL is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealth"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /health/ai:
    get:
      tags: [Health]
      operationId: get_ai_health
      summary: Check optional AI provider readiness
      responses:
        "200":
          description: AI is disabled or the configured provider is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiHealth"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AiUnavailable"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReviewLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: card_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID unique to one command intent.
      schema:
        type: string
        format: uuid

  headers:
    Location:
      description: Relative path of the created resource.
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request syntax or JSON
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: JSON request body exceeds 1 MiB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Domain state or uniqueness conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    DatabaseUnavailable:
      description: PostgreSQL is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AiUnavailable:
      description: Configured AI provider or model is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AiInvalidResponse:
      description: AI response failed strict structured validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AiTimeout:
      description: AI provider exceeded the configured timeout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0

    ProblemField:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, trace_id, errors]
      properties:
        type:
          type: string
          examples: ["urn:python-recall:error:validation-error"]
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemField"

    AiProviderName:
      type: string
      enum: [ollama]

    AiProviderStatus:
      type: string
      enum: [disabled, ready, unavailable, model_missing]

    AiProvider:
      type: object
      additionalProperties: false
      required: [name, enabled, status, model]
      properties:
        name:
          $ref: "#/components/schemas/AiProviderName"
        enabled:
          type: boolean
        status:
          $ref: "#/components/schemas/AiProviderStatus"
        model:
          type: string
          minLength: 1
          maxLength: 200

    AiProviders:
      type: object
      additionalProperties: false
      required: [default_provider, items]
      properties:
        default_provider:
          $ref: "#/components/schemas/AiProviderName"
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/AiProvider"

    AiHealth:
      type: object
      additionalProperties: false
      required: [status, provider, model]
      properties:
        status:
          type: string
          enum: [ok, disabled]
        provider:
          $ref: "#/components/schemas/AiProviderName"
        model:
          type: string
          minLength: 1
          maxLength: 200

    AiUsageScenario:
      type: object
      additionalProperties: false
      required: [scenario, request_count, success_count, error_count, input_tokens, output_tokens, total_tokens]
      properties:
        scenario: { type: string }
        request_count: { type: integer, minimum: 0 }
        success_count: { type: integer, minimum: 0 }
        error_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }

    AiUsageSummary:
      type: object
      additionalProperties: false
      required: [request_count, success_count, error_count, input_tokens, output_tokens, total_tokens, items, generated_at]
      properties:
        request_count: { type: integer, minimum: 0 }
        success_count: { type: integer, minimum: 0 }
        error_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AiUsageScenario" }
        generated_at: { type: string, format: date-time, readOnly: true }

    AnswerCorrectness:
      type: string
      enum: [correct, partially_correct, incorrect, needs_review]

    AnswerEvaluationCreate:
      type: object
      additionalProperties: false
      required: [attempt_id]
      properties:
        attempt_id:
          type: string
          format: uuid

    AnswerEvaluation:
      type: object
      additionalProperties: false
      required:
        - id
        - request_id
        - attempt_id
        - card_id
        - correctness
        - completeness
        - score
        - covered_concepts
        - missing_concepts
        - mistakes
        - feedback
        - recommendation
        - provider
        - model
        - prompt_version
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        attempt_id:
          type: string
          format: uuid
          readOnly: true
        card_id:
          type: string
          format: uuid
          readOnly: true
        correctness:
          $ref: "#/components/schemas/AnswerCorrectness"
        completeness:
          type: integer
          minimum: 0
          maximum: 100
        score:
          type: integer
          minimum: 0
          maximum: 100
        covered_concepts:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        missing_concepts:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        mistakes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        feedback:
          type: string
          minLength: 1
          maxLength: 5000
        recommendation:
          type: string
          minLength: 1
          maxLength: 5000
        provider:
          type: string
          minLength: 1
          maxLength: 50
        model:
          type: string
          minLength: 1
          maxLength: 200
        prompt_version:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true

    AnswerEvaluationPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnswerEvaluation"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CardQuality:
      type: string
      enum: [good, needs_improvement, needs_review]

    CardAnalysisCreate:
      type: object
      additionalProperties: false
      required: [card_id]
      properties:
        card_id: { type: string, format: uuid }

    CardIssue:
      type: object
      additionalProperties: false
      required: [field, severity, message]
      properties:
        field:
          type: string
          enum: [question, answer, explanation, code_example, general]
        severity:
          type: string
          enum: [info, warning, critical]
        message: { type: string, minLength: 1, maxLength: 1000 }

    CardAnalysis:
      type: object
      additionalProperties: false
      required: [id, request_id, card_id, quality, clarity_score, completeness_score, accuracy_score, specificity_score, learning_value_score, issues, feedback, recommendation, suggested_question, suggested_answer, suggested_explanation, suggested_code_example, provider, model, prompt_version, created_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        request_id: { type: string, format: uuid, readOnly: true }
        card_id: { type: string, format: uuid, readOnly: true }
        quality: { $ref: "#/components/schemas/CardQuality" }
        clarity_score: { type: integer, minimum: 0, maximum: 100 }
        completeness_score: { type: integer, minimum: 0, maximum: 100 }
        accuracy_score: { type: integer, minimum: 0, maximum: 100 }
        specificity_score: { type: integer, minimum: 0, maximum: 100 }
        learning_value_score: { type: integer, minimum: 0, maximum: 100 }
        issues:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CardIssue" }
        feedback: { type: string, minLength: 1, maxLength: 5000 }
        recommendation: { type: string, minLength: 1, maxLength: 5000 }
        suggested_question: { type: [string, "null"], maxLength: 10000 }
        suggested_answer: { type: [string, "null"], maxLength: 50000 }
        suggested_explanation: { type: [string, "null"], maxLength: 50000 }
        suggested_code_example: { type: [string, "null"], maxLength: 50000 }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }

    CardAnalysisPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CardAnalysis" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    CardGenerationCreate:
      type: object
      additionalProperties: false
      required: [topic_id]
      properties:
        topic_id: { type: string, format: uuid }
        source_text:
          type: [string, "null"]
          maxLength: 20000
          default: null
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 5

    CardSuggestionStatus:
      type: string
      enum: [pending, accepted, rejected]

    CardSuggestion:
      type: object
      additionalProperties: false
      required: [id, request_id, topic_id, accepted_card_id, status, position, question, answer, explanation, code_example, difficulty, provider, model, prompt_version, reviewed_at, created_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        request_id: { type: string, format: uuid, readOnly: true }
        topic_id: { type: string, format: uuid }
        accepted_card_id: { type: [string, "null"], format: uuid, readOnly: true }
        status: { $ref: "#/components/schemas/CardSuggestionStatus" }
        position: { type: integer, minimum: 0, maximum: 9 }
        question: { type: string, minLength: 1, maxLength: 10000 }
        answer: { type: string, minLength: 1, maxLength: 50000 }
        explanation: { type: [string, "null"], maxLength: 50000 }
        code_example: { type: [string, "null"], maxLength: 50000 }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        reviewed_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    CardSuggestionBatch:
      type: object
      additionalProperties: false
      required: [request_id, items]
      properties:
        request_id: { type: string, format: uuid, readOnly: true }
        items:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/CardSuggestion" }

    CardSuggestionPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CardSuggestion" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    Category:
      type: object
      additionalProperties: false
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 5000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CategoryCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 5000
          default: null

    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 5000

    CategoryPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Topic:
      type: object
      additionalProperties: false
