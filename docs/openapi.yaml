          schema: { $ref: "#/components/schemas/CardSuggestionStatus" }
      responses:
        "200":
          description: Paginated card suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardSuggestionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /ai/card-suggestions/{suggestion_id}:
